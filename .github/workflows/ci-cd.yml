name: CI CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate semantic version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "VERSION file is missing."
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z-]+)?$ ]]; then
            echo "VERSION must follow semantic versioning, got: $version"
            exit 1
          fi

          echo "Canonical version: $version"

  stage-build:
    needs: [check-version]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  stage-deploy:
    needs: [stage-build]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend server
        working-directory: backend
        run: |
          set -euo pipefail
          nohup npm start > /tmp/energy-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Smoke test API
        shell: bash
        run: |
          set -euo pipefail
          payload='{"householdSize":3,"electricityBill":90,"annualHeatingBill":1200,"postcode":"06108"}'
          response="$(curl -fsS -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:5001/api/calculate)"
          echo "$response" | jq '.weekly_summary.total_cost_eur, .weekly_summary.total_carbon_kg, .chart_data | length'

      - name: Stage deploy note
        run: |
          echo "Stage deployment smoke test passed. Configure GitHub environment secrets and deployment targets when you want to push to a real stage host."

  build:
    needs: [check-version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            frontend/dist
            backend/package-lock.json
          if-no-files-found: error

  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./artifact

      - name: Deployment placeholder
        shell: bash
        run: |
          set -euo pipefail
          echo "Build artifact is ready for deployment."
          echo "Set environment-specific deployment secrets and replace this placeholder with your real host, SSH, or platform deploy step."